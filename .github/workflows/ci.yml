name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (mascot rasterisation)
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate the manifests and build every bundle
        run: python3 build.py

      - name: Agent loop and protocol
        run: node test/loop.test.mjs

      - name: Action log invariants
        run: node test/actions.test.mjs

      - name: Policy and earned autonomy
        run: node test/policy.test.mjs

      - name: Cross-browser behaviour
        run: node test/crossbrowser.test.mjs

      - name: Bookmarklet bundle under a page-context harness
        run: node test/bookmarklet.test.mjs

      - name: Regenerate the mascot and fail if the committed assets drift
        run: |
          cp assets/ningaui-512.png /tmp/before.png
          python3 assets/mascot.py
          python3 - <<'PY'
          import hashlib, pathlib, sys
          a = hashlib.sha256(pathlib.Path('/tmp/before.png').read_bytes()).hexdigest()
          b = hashlib.sha256(pathlib.Path('assets/ningaui-512.png').read_bytes()).hexdigest()
          print('mascot assets', 'in sync' if a == b else 'OUT OF SYNC — run python3 assets/mascot.py')
          sys.exit(0 if a == b else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ningaui-bundles
          path: |
            ningaui-chrome-*.zip
            ningaui-firefox-*.zip
            ningaui-bookmarklet-*.zip
          if-no-files-found: error
